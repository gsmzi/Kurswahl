<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GSM-Kurswahl | Testversion für zu Hause</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffffff'/%3E%3Cpolygon points='2,2 28,2 10,20 2,20' fill='%231E287D'/%3E%3Cpolygon points='30,4 30,30 12,30 12,22' fill='%23BCBDBF'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="brand-bar">
    <div class="app-header">
      <div id="WindowHeading" class="title-block">
        <div class="title-line">
          <h1>GSM-Kurswahl</h1>
          <span id="StateBadge" class="pill pill-warn" title="Die automatische Prüfung unterstützt deine Planung. Dies ist eine unverbindliche Testversion für zu Hause (Selbstauskunft) ohne Abgabe an die Schule.">Vorläufig · unverbindlicher Probelauf</span>
        </div>
        <p id="Subtitle" class="subtitle">Unverbindliche Testversion für zu Hause (Selbstauskunft) · Abitur 2029 · keine Abgabe an die Schule</p>
      </div>
      <div id="FileToolbar" class="toolbar">
        <label class="checkbox-inline">
          <input id="AutosaveCheckbox" type="checkbox" checked />
          <span>Automatisch zwischenspeichern</span>
        </label>
        <button id="LoadButton" type="button" class="btn">Entwurf laden</button>
        <button id="SaveButton" type="button" class="btn">Entwurf speichern</button>
        <button id="ResetButton" type="button" class="btn">Neu beginnen</button>
      </div>
      <div class="brand-logo-wrap">
        <span class="header-divider" aria-hidden="true"></span>
        <img id="SchoolLogo" class="school-logo" src="./school-logo.jpg" alt="Gymnasium bei St. Michael Schwäbisch Hall" width="130" height="46" />
      </div>
    </div>
  </header>

  <div id="AppShell" class="app-shell">

    <nav id="Stepper" class="stepper" aria-label="Wahlschritte"></nav>

    <main class="main-body">
      <section class="left-column">
        <div id="ErrorNotice" class="notice notice-danger notice-bar hidden" role="alert">
          <span class="notice-icon" aria-hidden="true">⚠</span>
          <span id="ErrorNoticeText" class="notice-text"></span>
          <button id="DismissError" type="button" class="notice-dismiss" title="Meldung schließen" aria-label="Fehlermeldung schließen">✕</button>
        </div>
        <div id="SuccessNotice" class="notice notice-done notice-bar hidden" role="status">
          <span id="SuccessNoticeText" class="notice-text"></span>
          <button id="DismissSuccess" type="button" class="notice-dismiss" title="Hinweis schließen" aria-label="Erfolgsmeldung schließen">✕</button>
        </div>
        <div class="card">
          <div id="StepContent" class="step-content"></div>
        </div>
        <div class="step-navigation">
          <button id="PreviousStep" type="button" class="btn">Zurück</button>
          <span id="StepBlockerHint" class="step-blocker-hint hidden"></span>
          <button id="NextStep" type="button" class="btn btn-primary">Weiter</button>
        </div>
      </section>

      <aside class="card plan-panel" aria-label="Dein Plan">
        <div id="PlanPanel" class="plan-panel"></div>
      </aside>
    </main>

    <footer class="app-footer">
      <div id="HoursWarning" class="notice notice-warn hidden"></div>
      <div id="FileStatus" class="muted-text hidden"></div>
      <details id="Prerequisites" class="expander">
        <summary id="PrerequisitesSummary">Deine Voraussetzungen und technische Details</summary>
        <div id="PrerequisitesList" class="expander-body"></div>
      </details>
    </footer>
  </div>

  <div id="ConfirmModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="ConfirmTitle">
    <div class="modal-dialog">
      <h2 id="ConfirmTitle">Entwurf schützen</h2>
      <p id="ConfirmMessage" style="margin: 0;"></p>
      <div class="modal-actions">
        <button id="ConfirmCancel" type="button" class="btn">Abbrechen</button>
        <button id="ConfirmAccept" type="button" class="btn btn-primary">Bestätigen</button>
      </div>
    </div>
  </div>

  <section id="PrintSheet" class="print-sheet" aria-hidden="true"></section>

  <script src="./catalog.js"></script>
  <script src="./kurswahltest.js"></script>
</body>
</html>
